plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.clipboardfix'
    compileSdk 35

    defaultConfig {
        applicationId "com.clipboardfix"
        // minSdk 抬到 33：HyperOS 即 Android 13+；借此可直接用标准 AGSL（RuntimeShader）实现「关于」页动态渐变。
        minSdk 33
        targetSdk 35
        versionCode 112
        versionName "2.0"
        // 构建日期：编译时写入，供「关于/主页」展示
        buildConfigField "String", "BUILD_DATE", "\"${new Date().format('yyyy-MM-dd')}\""
        // 小米设备全部为 ARM 架构；剔除 x86 / x86_64 原生库（libdexkit.so），省约 817KB。
        // 只保留 arm64-v8a：再省约 253KB（armeabi-v7a 的 libdexkit.so + libandroidx.graphics.path.so）；
        // 代价是 32 位老设备装不上（用户已确认「老设备不管」）。
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // 统一用项目 keystore：debug 变体默认会用 Android 的 debug.keystore 签名，
    // 与已安装的 release 版签名不一致会导致覆盖安装失败（INSTALL_FAILED_UPDATE_INCOMPATIBLE）。
    // 重要：密钥库口令不再硬编码进仓库，避免泄露到公开 GitHub。
    //   读取顺序：local.properties（已被 .gitignore 忽略）→ 环境变量（CF_STORE_PASSWORD / CF_KEY_PASSWORD / CF_KEY_ALIAS）。
    //   两者皆缺时口令为空，签名阶段会直接报错，fail-safe 而非静默用空口令。
    signingConfigs {
        clipboard {
            storeFile file("../../clipboardfix.jks")
            def ksProps = new Properties()
            def ksFile = rootProject.file('local.properties')
            if (ksFile.exists()) {
                ksFile.withInputStream { ksProps.load(it) }
            }
            def storePw = ksProps.getProperty('STORE_PASSWORD')
            if (storePw == null) storePw = System.getenv('CF_STORE_PASSWORD') ?: ''
            def keyPw = ksProps.getProperty('KEY_PASSWORD')
            if (keyPw == null) keyPw = System.getenv('CF_KEY_PASSWORD') ?: ''
            def alias = ksProps.getProperty('KEY_ALIAS')
            if (alias == null) alias = System.getenv('CF_KEY_ALIAS') ?: 'clipboardfix'
            storePassword storePw
            keyAlias alias
            keyPassword keyPw
        }
    }

    buildTypes {
        debug {
            // 用与 release 相同的 keystore，保证可直接覆盖安装
            signingConfig signingConfigs.clipboard
            // debug 版保留导出日志按钮，供测试者抓日志
            buildConfigField "boolean", "ENABLE_EXPORT_LOG", "true"
        }
        release {
            signingConfig signingConfigs.clipboard
            // R8 收缩：砍掉 androidx.core / kotlin 用不到的代码（DexKit 与自身代码已整包 keep，DEX 安全瘦身）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // release 纯净版隐藏导出日志按钮
            buildConfigField "boolean", "ENABLE_EXPORT_LOG", "false"
        }
    }

    buildFeatures {
        buildConfig = true
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // libxposed:service 的 AAR 含 Java record，D8 需要 record desugaring 的全局 consumer
        coreLibraryDesugaringEnabled true
    }

    // 低内存环境：跳过 release lint（lintVital 会撑爆 metaspace），避免无谓的 metaspace OOM
    lint {
        checkReleaseBuilds = false
        abortOnError = false
    }

    sourceSets {
        main {
            // libxposed 新版模块声明放在 META-INF/xposed/ 下，显式声明以便打进 APK
            resources.srcDirs = ['src/main/resources']
        }
    }

    packagingOptions {
        // 依赖自带的 META-INF 元数据排除掉，但保留我们自己的 META-INF/xposed 模块声明
        exclude 'META-INF/LICENSE*'
        // AAR 里的 LICENSE.txt 藏在二级目录（如 META-INF/androidx/annotation/annotation/LICENSE.txt），
        // 上面的 LICENSE* 通配符不跨目录、匹配不到，4 份共约 40KB 全被打进包；这里补一刀。
        exclude 'META-INF/**/LICENSE.txt'
        exclude 'META-INF/NOTICE*'
        exclude 'META-INF/*.version'
        exclude 'META-INF/*.md'
        exclude 'META-INF/*.kotlin_module'
        exclude 'META-INF/proguard/**'
        exclude 'META-INF/com/**'
        exclude 'kotlin/**'
        exclude '**.bin'
    }
}

// 低内存环境（页面文件偏小）构建：不 fork 独立 javac 子进程，复用 Gradle JVM（256m），
// 避免再开一个 ≈3.75G 默认堆的子进程撑爆提交上限；本项目源码量小，256m 足够编译。
tasks.withType(JavaCompile).configureEach {
    options.fork = false
}

// libxposed:service:102.0.0 的 AAR 声明 minCompileSdk=37（其仅作为 binder 客户端，
// 实际不依赖 SDK 37 任何 API），本项目 compileSdk=35 且环境未装 SDK 37 平台，故关闭
// AAR 元数据(minCompileSdk)检查，避免无谓的构建阻断。运行时仍匹配设备 LSPosed API 102。
tasks.whenTaskAdded { task ->
    if (task.name.contains("AarMetadata")) {
        task.enabled = false
    }
}

dependencies {
    // libxposed 新 API（LSPosed 2.x 的 Modern API，API 102），替代旧 de.robv.android.xposed
    compileOnly 'io.github.libxposed:api:102.0.0'
    // libxposed service：XposedServiceHelper 查询模块在 LSPosed 中的启用状态 / 作用域（实时）
    // 用 101.0.0：102.0.0 的 AAR 含 Java record，导致低 minSdk 下 mergeExtDex 的 record desugaring 失败；
    // 101.0.0 接口稳定（registerListener / getScope）且 minCompileSdk 更低，可正常 dex。
    implementation 'io.github.libxposed:service:101.0.0'
    implementation 'androidx.core:core:1.12.0'

    // DexKit：精确定位 com.miui.provider.InputProvider 的包名校验方法
    implementation 'org.luckypray:dexkit:2.2.0'

    // record desugaring 运行时支撑（配合 coreLibraryDesugaringEnabled，覆盖 libxposed:service 的 record）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // ---- Compose + Miuix（2026-10-12 起：UI 迁 Compose/Miuix）----
    // Compose 入口与基础布局（LazyColumn/Grid 等由 Miuix 间接依赖，这里显式对齐版本）
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'org.jetbrains.compose.foundation:foundation-android:1.12.0'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    // Miuix 组件库（HyperOS 风格）：ui 为核心，preference/icons/blur 按需
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.4-rc01'
    implementation 'top.yukonga.miuix.kmp:miuix-preference-android:0.9.4-rc01'
    implementation 'top.yukonga.miuix.kmp:miuix-icons-android:0.9.4-rc01'
    implementation 'top.yukonga.miuix.kmp:miuix-blur-android:0.9.4-rc01'
    // Haze：关于页头部顶栏的渐进模糊（对齐参考项目顶栏；其模糊副本与来源同帧生成，无拖影）。
    // 与 layerBackdrop 并存：layerBackdrop 供毛玻璃卡片模糊极光，Haze 供头部条模糊滚动内容。
    implementation 'dev.chrisbanes.haze:haze:1.7.3'
    // Backdrop：液体玻璃（vibrancy + blur + lens 边缘折射带色散 + 高光描边 + 柔和投影），
    // 供设置页「语言 / 主题」下拉弹卡做 HyperOS 系统级玻璃观感。自带 shape 处理，无需额外 shapes 包。
    implementation 'io.github.kyant0:backdrop:2.0.0'
}

// Kotlin/Compose 工具链：jvmTarget 对齐本机 JDK 17（机器仅装 JDK 17，无 21）
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
